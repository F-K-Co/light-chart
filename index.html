<html lang="en">
<head>

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;height:100dvh;overflow:hidden;background:#1a1a2e;color:#eee;font-family:'SF Mono',Consolas,monospace}
#bar{height:30px;padding:4px 12px;display:flex;gap:10px;align-items:center;font-size:12px;display:none}
#bar label{color:#777}

#bar button:hover{background:#1a3a5c}
.row{position:relative;height:calc((100vh - 30px)/2);height:calc((100dvh - 30px)/2)}
.tag{position:absolute;top:3px;left:12px;font-size:10px;color:#555;z-index:5}
.leg{position:absolute;top:3px;left:60px;font-size:10px;display:flex;gap:8px;z-index:5}
.leg span{color:#666;display:flex;align-items:center;gap:2px}
.leg i{width:10px;height:2px;display:inline-block}
.marker-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:4}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100}
#modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#16213e;border:1px solid #333;border-radius:8px;padding:20px;z-index:101;min-width:360px;display:none}
#modal h3{margin-bottom:12px;font-size:14px;color:#aaa}
#modal .row-set{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
#modal .row-set label{flex:1;color:#ccc}
#modal .row-set input[type=checkbox]{width:16px;height:16px}
#modal .row-set input[type=color]{width:28px;height:22px;border:1px solid #555;background:none;cursor:pointer;border-radius:3px}
#modal .shape{color:#aaa;font-size:20px;min-width:28px;text-align:center}
#modal button.close{margin-top:12px;padding:6px 16px;background:#1a3a5c;border:1px solid #444;color:#eee;border-radius:4px;cursor:pointer;font:inherit}
#auth{position:fixed;inset:0;background:#1a1a2e;z-index:200;display:flex;align-items:center;justify-content:center}
#auth input{background:#16213e;color:#eee;border:1px solid #444;padding:8px 14px;border-radius:4px;font:inherit;font-size:14px;width:200px;text-align:center}
#authErr{color:#f44;font-size:11px;margin-top:8px;min-height:16px}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;font-size:13px;z-index:50}
</style>
</head>
